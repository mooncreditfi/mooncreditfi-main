<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="img" aria-labelledby="title description">
  <title id="title">MoonCreditFi financing dashboard</title>
  <desc id="description">Illustrative violet finance dashboard with gold Solana-inspired coins and a glowing architectural crescent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26144f"/>
      <stop offset=".55" stop-color="#15102f"/>
      <stop offset="1" stop-color="#090817"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b78cff"/>
      <stop offset=".5" stop-color="#7d4de1"/>
      <stop offset="1" stop-color="#4a2a91"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset=".5" stop-color="#e8b84b"/>
      <stop offset="1" stop-color="#9d681c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
    <radialGradient id="glow">
