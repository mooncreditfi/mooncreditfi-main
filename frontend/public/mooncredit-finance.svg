      <stop offset=".55" stop-color="#633bb7" stop-opacity=".12"/>
      <stop offset="1" stop-color="#1a1235" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#05030d" flood-opacity=".55"/>
    </filter>
  </defs>
